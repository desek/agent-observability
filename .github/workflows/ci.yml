# Continuous integration for @desek/pi-opentelemetry.
#
# Runs on every push and pull request. Two jobs:
#   - unit: the package's Node built-in test suite, on every Node line the
#     manifest's engines range admits. The suite runs with no network and no
#     running observability stack (NFR5), so it is a pure in-process check.
#   - smoke: the install smoke test (scripts/pi-package.verify.sh), which packs
#     the package, installs the tarball into a clean project, and loads the pi
#     manifest entry through jiti exactly as pi does. This is the check that
#     makes the Phase 2 entry-point finding binding: a broken files list fails
#     here rather than in a user's silent install.
#
# The engines field declares node ">=22.14.0". The matrix pins the promised
# floor (22.14.0) and the current maintained major lines at or above it (22, 24),
# so both the minimum the package guarantees and the newest runtime are covered.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so a fast push does not queue behind a
# stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.14.0", "22", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/pi-opentelemetry/package-lock.json

      - name: Install dependencies from the lockfile
        working-directory: packages/pi-opentelemetry
        run: npm ci

      - name: Run the unit test suite
        working-directory: packages/pi-opentelemetry
        run: npm test

  smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pack, install into a clean project, and load the manifest entry
        run: bash scripts/pi-package.verify.sh
