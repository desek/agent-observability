# stack/loki/config.yaml
#
# @agents-index Single-binary Loki configuration with filesystem storage and OTLP
# log ingestion for the local observability stack.
#
# Purpose: Configure Loki to run as a single process (all targets in one
# container) writing chunks and the TSDB index to local disk under the
# loki-data volume. Auth is disabled because the stack is local-only and binds
# to loopback. OTLP ingestion is enabled implicitly: Loki 3.x exposes the native
# OTLP endpoint at /otlp/v1/logs on the HTTP listener, which Alloy targets.

# Local dev: no multi-tenancy, no auth gate.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  # Keep logs quiet-ish but visible for debugging.
  log_level: info

common:
  # Single-instance ring and shared filesystem paths.
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # TSDB index with filesystem object store is the current recommended
    # single-binary schema for Loki 3.x.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Allow OTLP structured metadata (attributes) to be stored alongside logs.
  allow_structured_metadata: true
  # Promote git provenance resource attributes (stamped by the repo's .envrc
  # via OTEL_RESOURCE_ATTRIBUTES) to index labels so streams can be selected
  # per org/repo/branch/path: {git_org="...", git_repo="...", ...}. Path
  # cardinality is acceptable for a local single-user stack.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - git.org
            - git.repo
            - git.branch
            - git.path
  # Generous ingestion window for local dev so late/back-dated samples land.
  reject_old_samples: false
  volume_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

compactor:
  working_directory: /loki/compactor
