# stack/haproxy/haproxy.cfg
#
# @agents-index HAProxy edge-proxy config fronting the whole local LGTM stack on
# a single loopback port, routing OTLP gRPC (h2c), OTLP HTTP, Loki, Mimir, Tempo,
# Alloy UI, and Grafana by content and path to the internal backends.
#
# Purpose: collapse the seven per-service host ports into one published 127.0.0.1
# port. A single cleartext `mode http` frontend with NO `proto` on its bind
# accepts both HTTP/1.1 and prior-knowledge h2c on the same port: the H1 mux
# detects the HTTP/2 connection preface and upgrades to the H2 mux
# (`option disable-h2-upgrade` is deliberately left unset). OTLP gRPC is
# forwarded to alloy:4317 with an explicit `proto h2` on the server line because
# HAProxy does not autodetect the dial-out protocol. Every other backend is
# reached over the internal `otel` compose network by service name.
#
# Timeouts are sized generously for long-lived 1-second-interval gRPC HTTP/2
# export streams so the proxy never closes an active OTLP stream for inactivity.
#
# W3C trace-context headers (`traceparent`, `tracestate`) pass through unmodified
# in `mode http`; the pinned haproxy:3.4.2-trixie image is built without the
# OpenTracing filter, so no HAProxy trace emission is configured.

global
    log stdout format raw local0
    # Ship HAProxy's own access and error logs by syslog to Alloy over the otel
    # compose network. UDP RFC5424, one datagram per event, so there is no TCP
    # framing ambiguity for Alloy's loki.source.syslog listener. HAProxy is never
    # pointed at Loki directly; Alloy forwards the stream into the Loki write path.
    log udp@alloy:1514 format rfc5424 local0 info
    maxconn 4096

# Docker's embedded DNS server so backend service names are re-resolved at
# runtime (not just at boot), keeping servers reachable across container
# recreation on the otel network.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

defaults
    mode http
    log global
    # Human-readable, one-event-per-line, greppable access log (consistent with
    # the readable_log_lines convention in config.alloy): stable key=value fields
    # so `grep`/LogQL can slice HAProxy's Loki stream by field without bespoke
    # parsing. Replaces the terser default `option httplog`.
    log-format "haproxy client=%ci:%cp fe=%f be=%b srv=%s status=%ST bytes=%B t_total_ms=%Tt method=%HM uri=%HU proto=%HV term_state=%tsc"
    # Generous timeouts for persistent gRPC HTTP/2 OTLP export streams: agents
    # ship at 1-second intervals over connections that stay open for a whole
    # interactive session, so client/server/tunnel are set well above that.
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 30s
    timeout http-keep-alive 10s
    # Tolerate backends whose DNS name is not yet resolvable at proxy start
    # (compose start-ordering): resolve at runtime instead of failing to boot.
    default-server init-addr last,libc,none resolvers docker

# Single cleartext frontend: no `proto` on the bind so both HTTP/1.1 and
# prior-knowledge h2c (gRPC) are accepted and routed by content and path.
frontend edge
    # Bind all container interfaces: Docker forwards the published port to the
    # container's network IP, not its loopback. Host-side exposure is restricted
    # to 127.0.0.1 by the compose `ports: 127.0.0.1:${EDGE_PORT:-24317}:24317`
    # mapping, which is the load-bearing loopback-only privacy control.
    bind :24317

    # OTLP gRPC: matched by the gRPC content-type or the OTLP proto path prefix.
    acl is_grpc hdr(content-type) -m sub application/grpc
    acl is_otel_proto_path path_beg /opentelemetry.proto.

    # OTLP HTTP signal paths ship to Alloy's HTTP receiver (4318).
    acl is_otlp_http path /v1/logs /v1/metrics /v1/traces

    # Path-prefix routes for the remaining backends.
    acl is_loki path_beg /loki/
    acl is_mimir path_beg /prometheus
    acl is_tempo path_beg /tempo/
    acl is_alloy path_beg /alloy/
    acl is_mlflow path_beg /mlflow/

    # NOTE: path rewrites (readiness aliases, /tempo prefix strip) live in the
    # backends, not here. HAProxy runs all frontend http-request rules BEFORE
    # use_backend, so rewriting the path here would break the path_beg ACLs and
    # fall through to the default backend.

    use_backend alloy_grpc if is_grpc || is_otel_proto_path
    use_backend alloy_http if is_otlp_http
    use_backend loki if is_loki
    use_backend mimir if is_mimir
    use_backend tempo if is_tempo
    use_backend alloy_ui if is_alloy
    use_backend mlflow if is_mlflow
    default_backend grafana

# OTLP gRPC receiver: explicit `proto h2` because the dial-out protocol is not
# autodetected and Alloy's 4317 receiver is gRPC (h2c) only.
backend alloy_grpc
    option httpchk GET /alloy/-/ready
    http-check expect status 200
    server alloy alloy:4317 proto h2 check port 12345

backend alloy_http
    option httpchk GET /alloy/-/ready
    http-check expect status 200
    server alloy alloy:4318 check port 12345

backend loki
    # Proxied readiness alias: /loki/ready reaches Loki's native /ready. The
    # Loki query API is already under /loki/api/v1 and passes through unchanged.
    http-request set-path /ready if { path /loki/ready }
    option httpchk GET /ready
    http-check expect status 200
    server loki loki:3100 check

backend mimir
    # Proxied readiness alias: /prometheus/ready reaches Mimir's native /ready.
    # Mimir serves its query API natively under /prometheus, so those paths pass
    # through unchanged.
    http-request set-path /ready if { path /prometheus/ready }
    option httpchk GET /ready
    http-check expect status 200
    server mimir mimir:9009 check

backend tempo
    # Strip the /tempo prefix so Tempo's /api/* does not collide with Grafana's
    # /api/* on the shared frontend root.
    http-request replace-path /tempo/?(.*) /\1
    option httpchk GET /ready
    http-check expect status 200
    server tempo tempo:3200 check

backend alloy_ui
    option httpchk GET /alloy/-/healthy
    http-check expect status 200
    server alloy alloy:12345 check

backend grafana
    option httpchk GET /api/health
    http-check expect status 200
    server grafana grafana:3000 check

# MLflow tracking server. Served under --static-prefix=/mlflow, so the UI, REST
# API, artifact-proxy, and health routes all live under /mlflow and no path
# rewrite is needed (unlike tempo). The health probe carries an explicit
# `Host: localhost` header because MLflow 3.x runs host-validation middleware
# whose default allow-list accepts localhost on any port but would reject
# HAProxy's default check request that has no Host header.
backend mlflow
    option httpchk GET /mlflow/health
    http-check send hdr host localhost
    http-check expect status 200
    server mlflow mlflow:5000 check

# Built-in Prometheus exporter: serves HAProxy's own runtime metrics at /metrics
# on a fixed internal port. This listener is NOT published to the host in
# compose.yaml; it is reachable only by Alloy over the otel network, which
# scrapes it into the existing Mimir metrics store. Its own request lines are
# dropped (`no log`) so the exporter's scrape traffic does not flood the HAProxy
# access log.
frontend prometheus_exporter
    bind :8405
    no log
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404 if !{ path /metrics }
